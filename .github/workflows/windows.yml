name: Windows

on:
  push:
    paths:
      - ".github/workflows/windows.yml"
      - "desktopApp/**"
      - "helper/**"
      - "shared/**"
      - "scripts/**"
      - "packaging/**"
      - "installer-bootstrap/**"
      - "*.gradle.kts"
      - "gradle/**"
  pull_request:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - shell: powershell
        run: .\scripts\bootstrap-runtime.ps1
      - name: Validate OTA publisher
        shell: powershell
        run: python -m py_compile .\scripts\publish_ota.py
      - shell: powershell
        run: .\gradlew.bat test :shared:jvmTest :desktopApp:compileKotlin --stacktrace
