name: Windows

permissions:
  contents: read

on:
  push:
    paths:
      - ".github/workflows/windows.yml"
      - "desktopApp/**"
      - "helper/**"
      - "shared/**"
      - "scripts/**"
      - "packaging/**"
      - "installer-bootstrap/**"
      - "*.gradle.kts"
      - "gradle/**"
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build versioned Windows OTA package
        type: boolean
        default: false
      fairway_full_tun:
        description: Run isolated Fairway full TUN against the prepared lab peer
        type: boolean
        default: false

jobs:
  fairway-wintun-leaf:
    if: github.event_name != 'workflow_dispatch' || !inputs.fairway_full_tun
    name: Actual Wintun leaf lifecycle (not full Fairway Internet)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - shell: powershell
        run: .\scripts\bootstrap-runtime.ps1
      - name: Create, identify and remove actual custom Wintun adapter without IP or routes
        shell: powershell
        run: |
          $env:VEILARK_TEST_FAIRWAY_WINTUN_LEAF = '1'
          $env:VEILARK_TEST_WINTUN_DLL = (Resolve-Path 'packaging\resources\windows\wintun.dll').Path
          .\gradlew.bat :helper:test --tests '*FairwayWintunLeafTest' --max-workers=2 --stacktrace
          $testExit = $LASTEXITCODE
          $report = 'helper\build\test-results\test\TEST-uk.senyasenyavski.veilark.helper.FairwayWintunLeafTest.xml'
          if (-not (Test-Path -LiteralPath $report)) { throw "Actual Wintun leaf report is missing; exit=$testExit" }
          [xml]$result = Get-Content -LiteralPath $report
          $suite = $result.testsuite
          Write-Host "Actual Wintun leaf: tests=$($suite.tests), skipped=$($suite.skipped), failures=$($suite.failures), errors=$($suite.errors)"
          if ($testExit -ne 0 -or [int]$suite.tests -ne 1 -or [int]$suite.skipped -ne 0 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0) {
            throw 'Actual Wintun leaf must execute successfully; skipping is not acceptance'
          }
      - name: Preserve actual Wintun leaf receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actual-wintun-leaf-receipt
          path: |
            helper/build/test-results/test/
            helper/build/reports/tests/test/
          if-no-files-found: warn
  test:
    if: github.event_name != 'workflow_dispatch' || !inputs.fairway_full_tun
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - shell: powershell
        run: .\scripts\bootstrap-runtime.ps1
      - name: Validate OTA publisher
        shell: powershell
        run: |
          python --version
          python -m pip install --disable-pip-version-check -r .\scripts\requirements-ota.txt
          if ($LASTEXITCODE -ne 0) { throw 'OTA publisher dependencies failed to install' }
          python -m py_compile .\scripts\publish_ota.py
          if ($LASTEXITCODE -ne 0) { throw 'OTA publisher does not compile' }
          python .\scripts\test_publish_ota.py -v
          if ($LASTEXITCODE -ne 0) { throw 'OTA publisher regression tests failed' }
      - name: Validate OTA version ordering
        shell: powershell
        run: .\scripts\test-ota-version.ps1
      - name: Verify OTA bootstrap payload protection
        shell: powershell
        run: |
          $version = [regex]::Match((Get-Content -Raw desktopApp\build.gradle.kts), 'packageVersion = "([^"]+)"').Groups[1].Value
          $testDirectory = Join-Path (Get-Location) 'build\bootstrap-test'
          New-Item -ItemType Directory -Force -Path $testDirectory | Out-Null
          $payload = Join-Path $testDirectory "Veilark-$version.exe"
          $bytes = New-Object byte[] (3MB + 17)
          (New-Object Random 42).NextBytes($bytes)
          [IO.File]::WriteAllBytes($payload, $bytes)
          $wrapper = Join-Path $testDirectory 'verify\Veilark-verify.exe'
          .\scripts\build-ota-bootstrap.ps1 -InnerInstaller $payload -Output $wrapper -VerificationOnly
          $before = @(Get-ChildItem -Path (Join-Path $env:SystemRoot 'Temp') -Filter 'Veilark-ota-*' -Directory -ErrorAction SilentlyContinue).Count
          $output = & $wrapper --bootstrap-verify-only
          $exitCode = $LASTEXITCODE
          $expected = (Get-FileHash -Algorithm SHA256 -LiteralPath $payload).Hash
          if ($exitCode -ne 0 -or (@($output) | Select-Object -Last 1) -ne $expected) {
            throw "Bootstrap verification failed: exit=$exitCode output=$output"
          }
          $after = @(Get-ChildItem -Path (Join-Path $env:SystemRoot 'Temp') -Filter 'Veilark-ota-*' -Directory -ErrorAction SilentlyContinue).Count
          if ($after -gt $before) { throw 'Protected OTA directory was not removed' }
          $env:VEILARK_TEST_WRAPPER = $wrapper
          $env:VEILARK_TEST_VERSION = $version
          python -c "import os, sys; sys.path.insert(0, 'scripts'); import publish_ota; from pathlib import Path; print('Wrapper file version', publish_ota.validate_installer_version(Path(os.environ['VEILARK_TEST_WRAPPER']), os.environ['VEILARK_TEST_VERSION'], False))"
          if ($LASTEXITCODE -ne 0) { throw 'Publisher could not read the wrapper file version' }
      - shell: powershell
        run: .\gradlew.bat test :shared:jvmTest :desktopApp:compileKotlin --max-workers=2 --stacktrace
      - name: Verify native startup contract on isolated Windows runner
        shell: powershell
        run: |
          $env:SING_BOX_CHECKER = (Resolve-Path 'packaging\resources\windows\sing-box.exe').Path
          $env:VEILARK_TEST_NATIVE_TUN = '1'
          .\gradlew.bat :helper:test --tests '*SingBoxNativeTunTest' --tests '*SingBoxRuntimeConfigurationTest' --tests '*CoreLogPumpTest' --max-workers=2 --stacktrace
          $nativeExit = $LASTEXITCODE
          $resultPath = 'helper\build\test-results\test\TEST-uk.senyasenyavski.veilark.helper.SingBoxNativeTunTest.xml'
          if (-not (Test-Path -LiteralPath $resultPath)) { throw "Native TUN report missing; Gradle exit=$nativeExit" }
          [xml]$result = Get-Content -LiteralPath $resultPath
          $suite = $result.testsuite
          Write-Host "Native TUN acceptance: executed=$($suite.tests), skipped=$($suite.skipped), failures=$($suite.failures), errors=$($suite.errors)"
          foreach ($failure in $result.SelectNodes('//testcase/failure | //testcase/error')) {
            Write-Host "Native TUN failure: $($failure.GetAttribute('message'))"
            $detail = $failure.InnerText
            Write-Host $detail.Substring(0, [Math]::Min(3000, $detail.Length))
          }
          if ($nativeExit -ne 0) { throw "Native startup contract failed; Gradle exit=$nativeExit" }
          if ([int]$suite.tests -lt 1 -or [int]$suite.skipped -ne 0 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0) {
            throw 'Native TUN acceptance must execute, not skip'
          }
      - name: Verify installed application resources
        shell: powershell
        run: |
          .\gradlew.bat :desktopApp:createDistributable --stacktrace
          .\scripts\verify-packaged-resources.ps1
      - name: Package verified OTA payload
        if: github.event_name == 'workflow_dispatch' && inputs.package
        shell: powershell
        run: |
          .\gradlew.bat :desktopApp:packageExe :desktopApp:packageMsi --max-workers=2 --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          $version = [regex]::Match((Get-Content -Raw desktopApp\build.gradle.kts), 'packageVersion = "([^"]+)"').Groups[1].Value
          $payload = "desktopApp\build\compose\binaries\main\exe\Veilark-$version.exe"
          .\scripts\build-ota-bootstrap.ps1 -InnerInstaller $payload -Output "build\ota\Veilark-$version.exe"
          .\scripts\build-ota-bootstrap.ps1 -InnerInstaller $payload -Output "build\verify\Veilark-verify.exe" -VerificationOnly
          & .\build\verify\Veilark-verify.exe --bootstrap-verify-only
          if ($LASTEXITCODE -ne 0) { throw 'Embedded payload verification failed' }
          Get-FileHash -Algorithm SHA256 "build\ota\Veilark-$version.exe"
      - name: Verify in-place upgrade from the published Windows release
        if: github.event_name == 'workflow_dispatch' && inputs.package
        timeout-minutes: 20
        shell: powershell
        run: |
          $version = [regex]::Match((Get-Content -Raw desktopApp\build.gradle.kts), 'packageVersion = "([^"]+)"').Groups[1].Value
          .\scripts\test-in-place-upgrade.ps1 -CandidateInstaller "build\ota\Veilark-$version.exe"
      - name: Upload Windows release candidate
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veilark-windows-ota
          retention-days: 7
          path: |
            build/ota/Veilark-*.exe
            desktopApp/build/compose/binaries/main/msi/Veilark-*.msi
            desktopApp/build/reports/ui/*.png
            desktopApp/build/test-results/test/*.xml
            helper/build/test-results/test/*.xml
            shared/build/test-results/jvmTest/*.xml
  isolated-full-tun:
    if: github.event_name == 'workflow_dispatch' && inputs.fairway_full_tun && github.ref == 'refs/heads/local/windows-fairway-20261025'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Publish safe runner preflight before waiting for lab peer
        shell: powershell
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable runner required' }
          $trace = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 15 -Uri 'https://1.1.1.1/cdn-cgi/trace').Content
          $publicIp = [regex]::Match($trace, '(?m)^ip=([0-9.]+)\r?$').Groups[1].Value
          $parsed = $null
          if (-not [Net.IPAddress]::TryParse($publicIp, [ref]$parsed) -or $parsed.AddressFamily -ne [Net.Sockets.AddressFamily]::InterNetwork) { throw 'No valid runner IPv4' }
          @{ run_id = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT; sha = $env:GITHUB_SHA; public_ipv4 = $publicIp } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $env:RUNNER_TEMP 'fairway-runner-preflight.json')
      - name: Preserve runner preflight for isolated peer firewall
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: isolated-fairway-runner-preflight
          path: ${{ runner.temp }}/fairway-runner-preflight.json
          if-no-files-found: error
      - shell: powershell
        run: .\scripts\bootstrap-runtime.ps1
      - name: Compile the real product session path
        shell: powershell
        run: |
          .\gradlew.bat :helper:classes :helper:exportRuntimeClasspath --max-workers=2
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
      - name: Isolated peer full TUN acceptance (two cycles, no UAC)
        shell: powershell
        env:
          FAIRWAY_CI_BUNDLE_URL: ${{ secrets.FAIRWAY_CI_BUNDLE_URL }}
          FAIRWAY_CI_BUNDLE_KEY: ${{ secrets.FAIRWAY_CI_BUNDLE_KEY }}
        run: |
          if (-not $env:FAIRWAY_CI_BUNDLE_URL -or -not $env:FAIRWAY_CI_BUNDLE_KEY) { throw 'Missing isolated-peer bundle secrets; no test was run' }
          $env:VEILARK_TEST_FAIRWAY_FULL_TUN = '1'
          $env:VEILARK_CI_RECEIPT = Join-Path $env:RUNNER_TEMP 'fairway-full-tun-receipt.json'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'veilark-isolated-appdata'
          $classpath = (Get-Content helper\build\runtime-classpath.txt -Raw).Trim()
          & "$env:JAVA_HOME\bin\java.exe" -Dfile.encoding=UTF-8 -cp $classpath uk.senyasenyavski.veilark.helper.FairwayCiTunnelCheck
          $javaExit = $LASTEXITCODE
          if (Test-Path -LiteralPath $env:VEILARK_CI_RECEIPT) {
            $receipt = Get-Content -LiteralPath $env:VEILARK_CI_RECEIPT -Raw | ConvertFrom-Json
            $receipt | Add-Member -NotePropertyName processExit -NotePropertyValue $javaExit -Force
            $receipt | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 -LiteralPath $env:VEILARK_CI_RECEIPT
          }
          if ($javaExit -ne 0) { throw 'Isolated full TUN did not pass; inspect the safe receipt' }
      - name: Remove isolated files after the native process exits
        if: always()
        shell: powershell
        run: |
          # CAP_PROCESS_PIN deliberately keeps the native image mapped until Java exits.
          # Only this parent may delete its work directory, including that DLL.
          $receiptPath = Join-Path $env:RUNNER_TEMP 'fairway-full-tun-receipt.json'
          if (Test-Path -LiteralPath $receiptPath) {
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          } else {
            $receipt = [pscustomobject]@{ passed = $false; tunnelPassed = $false; cycles = @(); processExit = -1 }
          }
          $root = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $names = @('veilark-isolated-appdata')
          $cleaned = $true
          try {
            if ($receipt.workBasename) {
              if ($receipt.workBasename -notmatch '^veilark-isolated-full-tun-[A-Za-z0-9._-]+$') { throw 'Invalid owned work directory' }
              $names += $receipt.workBasename
            }
            foreach ($name in $names) {
              $target = [IO.Path]::GetFullPath((Join-Path $root $name))
              if (-not [IO.Path]::GetDirectoryName($target).Equals($root, [StringComparison]::OrdinalIgnoreCase)) { throw 'Unexpected cleanup target' }
              if (Test-Path -LiteralPath $target) {
                if ((Get-Item -LiteralPath $target -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Refusing a redirected work directory' }
                Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction Stop
              }
              if (Test-Path -LiteralPath $target) { throw 'Owned work directory remains after cleanup' }
            }
          } catch { $cleaned = $false }
          $passed = $receipt.tunnelPassed -eq $true -and $receipt.processExit -eq 0 -and $cleaned -and @($receipt.cycles).Count -eq 2
          foreach ($cycle in @($receipt.cycles)) {
            foreach ($field in @('passed', 'connected', 'ownedAdapter', 'boundInternet', 'bidirectionalTraffic', 'stopped', 'adapterAbsent', 'internetRecovered')) {
              if ($cycle.$field -ne $true) { $passed = $false }
            }
          }
          $receipt | Add-Member -NotePropertyName cleanup -NotePropertyValue $cleaned -Force
          $receipt | Add-Member -NotePropertyName postExitCleanup -NotePropertyValue $cleaned -Force
          $receipt | Add-Member -NotePropertyName passed -NotePropertyValue $passed -Force
          $receipt | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 -LiteralPath $receiptPath
          if (-not $passed) { throw 'Full TUN traffic, two cycles and post-exit cleanup must all pass' }
      - name: Preserve safe full TUN receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: isolated-fairway-full-tun-receipt
          path: ${{ runner.temp }}/fairway-full-tun-receipt.json
          if-no-files-found: warn
