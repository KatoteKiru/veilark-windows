name: Windows

on:
  push:
    paths:
      - ".github/workflows/windows.yml"
      - "desktopApp/**"
      - "helper/**"
      - "shared/**"
      - "scripts/**"
      - "packaging/**"
      - "installer-bootstrap/**"
      - "*.gradle.kts"
      - "gradle/**"
  pull_request:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - shell: powershell
        run: .\scripts\bootstrap-runtime.ps1
      - name: Validate OTA publisher
        shell: powershell
        run: python -m py_compile .\scripts\publish_ota.py
      - shell: powershell
        run: .\gradlew.bat test :shared:jvmTest :desktopApp:compileKotlin --stacktrace
      - name: Verify installed application resources
        shell: powershell
        run: |
          .\gradlew.bat :desktopApp:createDistributable --stacktrace
          .\scripts\verify-packaged-resources.ps1
